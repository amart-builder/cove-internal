<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cove Today, Single Lane and Focus Grid</title>
  <style>
    :root {
      --quiet-water: #6f918b;
      --quiet-glass: rgba(255,255,255,.72);
      --quiet-shadow: 0 28px 90px rgba(44,59,55,.10);
      --current-line-warm: #fff1d1;
      --current-line-core: #fff;
      --current-line-cool: #d7efff;
      --current-water-blue: #b8ddf4;
      --current-water-deep: #86bde1;
      --current-sun: #b97832;
      --current-kicker: #2d7fc0;
      --current-title-ink: #172126;
      --orb-blue-1: #45a7e8;
      --orb-blue-2: #2585cf;
      --node-dot: #77acd1;
      --undo-bg: #202623;
      --undo-ink: #f6f8f7;
      --undo-action: #9bd3f4;
      --undo-timer: #78bce7;
      --ease-out-cove: cubic-bezier(.2,.78,.22,1);
      --muted-ink: rgba(23,33,38,.56);
    }

    * { box-sizing: border-box; }

    html { zoom: .8; }
    html, body { width: 100%; height: 100%; margin: 0; }

    body {
      min-width: 1100px;
      overflow: hidden;
      color: var(--current-title-ink);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #edf6f9;
    }

    button { font: inherit; }

    .today-shell {
      position: fixed;
      inset: 0;
      min-width: 1100px;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 49% 41%, rgba(255,255,255,.86) 0, rgba(255,255,255,.28) 21%, transparent 40%),
        linear-gradient(180deg, #f6e5d0 0%, #fbf3e8 22%, #f8fbfb 51%, #e8f4f8 72%, #bfdfef 100%);
      transform-origin: 50% 76%;
      transition: transform .36s var(--ease-out-cove), filter .36s var(--ease-out-cove);
    }

    .today-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(105deg, rgba(255,255,255,.1), transparent 30%, rgba(255,255,255,.13) 70%, transparent);
      opacity: .75;
    }

    body.grid-open .today-shell {
      transform: scale(.98);
      filter: blur(8px);
    }

    .day-header {
      position: absolute;
      z-index: 5;
      top: clamp(42px, 7vh, 74px);
      left: clamp(52px, 6vw, 104px);
      width: 390px;
    }

    .eyebrow,
    .kicker {
      margin: 0;
      color: var(--current-kicker);
      font-size: 10px;
      font-weight: 680;
      letter-spacing: .16em;
      line-height: 1;
      text-transform: uppercase;
    }

    .clock {
      margin-top: 12px;
      font-size: 3.8rem;
      font-weight: 300;
      letter-spacing: -.045em;
      line-height: .96;
      font-variant-numeric: tabular-nums;
    }

    .greeting {
      margin: 13px 0 19px;
      color: rgba(23,33,38,.64);
      font-size: 13px;
      letter-spacing: -.005em;
    }

    .quiet-actions { display: flex; gap: 19px; }

    .quiet-action {
      appearance: none;
      border: 0;
      padding: 4px 0;
      color: rgba(23,33,38,.48);
      background: none;
      font-size: 12px;
      cursor: default;
      transition: color .2s ease;
    }

    .quiet-action:hover { color: rgba(23,33,38,.74); }

    .sun-arc {
      position: absolute;
      z-index: 2;
      top: 24px;
      right: clamp(38px, 5vw, 78px);
      width: 290px;
      height: 120px;
      opacity: .62;
      overflow: visible;
    }

    .sun-arc-path {
      fill: none;
      stroke: rgba(185,120,50,.48);
      stroke-width: 1.15;
      stroke-linecap: round;
      stroke-dasharray: 2 7;
    }

    .sun-now { fill: var(--current-sun); }
    .sun-glyph { stroke: var(--current-sun); stroke-width: 1.15; stroke-linecap: round; }

    .lane {
      position: absolute;
      z-index: 3;
      top: 0;
      left: 50%;
      width: min(700px, 54vw);
      height: 100%;
      transform: translateX(-50%);
    }

    .river {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .river-glow {
      fill: none;
      stroke: url(#riverGradient);
      stroke-width: 22;
      stroke-linecap: round;
      opacity: .42;
      filter: blur(9px);
    }

    .river-soft {
      fill: none;
      stroke: url(#riverGradient);
      stroke-width: 10;
      stroke-linecap: round;
      opacity: .58;
      filter: blur(2.5px);
    }

    .river-core {
      fill: none;
      stroke: rgba(255,255,255,.96);
      stroke-width: 5;
      stroke-linecap: round;
      opacity: .92;
      filter: drop-shadow(0 0 7px rgba(255,255,255,.94));
    }

    .river-shimmer {
      fill: none;
      stroke: rgba(255,255,255,.7);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-dasharray: 42 38;
      opacity: .48;
      animation: riverShimmer 14s linear infinite;
    }

    @keyframes riverShimmer { to { stroke-dashoffset: -188; } }

    .done-marker {
      position: absolute;
      z-index: 4;
      top: 22.5%;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 0;
      padding: 7px 10px;
      color: rgba(23,33,38,.55);
      background: transparent;
      font-size: 11px;
      transform: translateX(-50%);
      cursor: default;
    }

    .done-dots { display: flex; align-items: center; gap: 4px; }
    .done-dots i { display: block; width: 4px; height: 4px; border-radius: 50%; background: var(--node-dot); }
    .done-dots i:nth-child(1) { opacity: .22; }
    .done-dots i:nth-child(2) { opacity: .38; }
    .done-dots i:nth-child(3) { opacity: .58; }

    .done-count { display: inline-grid; overflow: hidden; }
    .done-count span { grid-area: 1/1; transition: opacity .15s ease, transform .15s var(--ease-out-cove); }
    .done-count .leaving { opacity: 0; transform: translateY(-6px); }
    .done-count .arriving { opacity: 0; transform: translateY(6px); }

    .now-wrap {
      position: absolute;
      z-index: 7;
      top: 43.5%;
      left: 50%;
      width: min(560px, 48vw);
      transform: translate(-50%, -50%);
      transition: opacity .2s ease, transform .2s var(--ease-out-cove);
    }

    .now-wrap.focus-refresh { animation: focusRefresh .2s ease both; }
    @keyframes focusRefresh {
      from { opacity: 0; filter: blur(2px); transform: translate(-50%, -50%); }
      to { opacity: 1; filter: blur(0); transform: translate(-50%, -50%); }
    }

    .now-card {
      position: relative;
      min-height: 150px;
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 27px 27px 27px 31px;
      border: 1px solid rgba(255,255,255,.62);
      border-radius: 25px;
      background: var(--quiet-glass);
      box-shadow: var(--quiet-shadow), inset 0 1px 0 rgba(255,255,255,.72);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      transform-origin: 50% 50%;
      transition: transform .42s var(--ease-out-cove), opacity .34s ease, box-shadow .32s ease;
    }

    .now-card::after {
      content: "";
      position: absolute;
      inset: -1px;
      border: 1px solid rgba(89,178,233,.42);
      border-radius: inherit;
      opacity: 0;
      pointer-events: none;
    }

    .now-card.pulsing::after { animation: cardPulse .62s var(--ease-out-cove); }
    @keyframes cardPulse {
      0% { opacity: .7; transform: scale(.985); box-shadow: 0 0 0 0 rgba(69,167,232,.2); }
      100% { opacity: 0; transform: scale(1.065); box-shadow: 0 0 0 24px rgba(69,167,232,0); }
    }

    .now-card.confirming,
    .compact-focus-card.confirming {
      transform: scale(1.03);
      box-shadow: 0 30px 94px rgba(44,59,55,.12), 0 0 0 8px rgba(69,167,232,.07), inset 0 1px 0 rgba(255,255,255,.78);
      transition: transform .09s var(--ease-out-cove), box-shadow .09s ease;
    }

    .now-card.completing,
    .compact-focus-card.completing {
      pointer-events: none;
      transition: none;
      will-change: transform, opacity, border-radius;
    }

    .now-card.restored { animation: restoredCard .36s var(--ease-out-cove) both; }
    .now-card.undoing { opacity: .12; transform: translateY(27.5vh) scale(.08); border-radius: 50%; }
    @keyframes restoredCard { from { opacity: 0; transform: scale(.52); filter: blur(2px); border-radius: 50%; } }

    .focus-band { position: absolute; z-index: 12; top: 43.5%; left: 50%; display: flex; align-items: flex-start; gap: 18px; transform: translate(-50%,-50%); }
    .focus-band.count-2 .focus-unit { width: 332px; }
    .focus-band.count-3 .focus-unit { width: 296px; }
    .focus-unit { position: relative; z-index: 12; flex: 0 0 auto; }
    /* The single-focus hero is both .now-wrap and .focus-unit; it must keep its
       absolute lane positioning or top: 43.5% resolves against its own wrapper. */
    .now-wrap.focus-unit { position: absolute; }
    .focus-band.focus-refresh { animation: focusRefresh .2s ease both; }
    .compact-focus-card { position: relative; min-height: 116px; display: flex; align-items: center; gap: 15px; padding: 16px 18px; border: 1px solid rgba(255,255,255,.68); border-radius: 19px; background: var(--quiet-glass); box-shadow: 0 20px 54px rgba(44,59,55,.09), inset 0 1px 0 rgba(255,255,255,.76); backdrop-filter: blur(14px) saturate(160%); cursor: pointer; transition: transform .34s var(--ease-out-cove), opacity .28s ease, box-shadow .24s ease; }
    .compact-focus-card:hover { box-shadow: 0 24px 60px rgba(44,59,55,.12), inset 0 1px 0 rgba(255,255,255,.82); }
    .compact-focus-card::after { content: ""; position: absolute; inset: -1px; border: 1px solid rgba(89,178,233,.44); border-radius: inherit; opacity: 0; pointer-events: none; }
    .compact-focus-card.pulsing::after { animation: cardPulse .62s var(--ease-out-cove); }
    .compact-focus-card.restored { animation: restoredCard .36s var(--ease-out-cove) both; }
    .compact-focus-card.undoing { opacity: .08; transform: translateY(27.5vh) scale(.08); border-radius: 50%; }
    .compact-copy { flex: 1; min-width: 0; }
    .compact-kicker { margin: 0 0 8px; color: var(--current-kicker); font-size: 8px; font-weight: 680; letter-spacing: .16em; text-transform: uppercase; }
    .compact-title { margin: 0 0 10px; color: var(--current-title-ink); font-size: 16px; font-weight: 560; letter-spacing: -.018em; line-height: 1.28; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    .compact-focus-card .check-orb { flex-basis: 44px; width: 44px; height: 44px; box-shadow: 0 8px 20px rgba(37,133,207,.24), 0 0 0 5px rgba(69,167,232,.06), inset 0 1px 1px rgba(255,255,255,.38); }
    .compact-focus-card .check-orb svg { width: 21px; height: 21px; }
    .task-state { display: flex; align-items: center; gap: 7px; margin: -3px 0 9px; color: rgba(45,111,153,.72); font-size: 10px; animation: stateSwap .18s ease both; }
    .task-state .working-dot { width: 5px; height: 5px; }
    .task-state.conversation { color: rgba(23,33,38,.48); }
    .task-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 22px; }
    .ready-button { flex: 0 0 auto; border: 0; border-radius: 999px; padding: 6px 11px; color: #fff; background: linear-gradient(145deg, var(--orb-blue-1), var(--orb-blue-2)); box-shadow: 0 5px 14px rgba(37,133,207,.22); font-size: 11px; font-weight: 650; cursor: pointer; transition: transform .1s var(--ease-out-cove), box-shadow .18s ease; }
    .ready-button:hover { box-shadow: 0 7px 18px rgba(37,133,207,.3); }
    .ready-button:active { transform: scale(.97); }
    .ready-button.materializing { animation: readyMaterialize .24s cubic-bezier(.23,1,.32,1) both; }
    .claude-open-toast { position: absolute; z-index: 36; top: calc(100% + 8px); left: 50%; width: max-content; padding: 7px 10px; border: 1px solid rgba(255,255,255,.65); border-radius: 999px; color: rgba(23,33,38,.68); background: rgba(255,255,255,.76); box-shadow: 0 12px 28px rgba(44,59,55,.11); backdrop-filter: blur(14px) saturate(150%); font-size: 11px; pointer-events: none; animation: claudeToast 1.4s ease both; }
    @keyframes stateSwap { from { opacity: 0; } }
    @keyframes readyMaterialize { 0% { opacity: 0; transform: scale(.92); box-shadow: 0 0 0 0 rgba(69,167,232,.2); } 62% { opacity: 1; transform: scale(1.02); box-shadow: 0 0 0 7px rgba(69,167,232,.09); } 100% { opacity: 1; transform: scale(1); box-shadow: 0 5px 14px rgba(37,133,207,.22); } }
    @keyframes claudeToast { 0% { opacity: 0; transform: translate(-50%, 4px); } 12%,78% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -3px); } }
    .now-card[data-task-id] { cursor: pointer; }

    .task-detail { position: absolute; z-index: 32; top: calc(100% + 8px); left: 0; width: 100%; padding: 14px 15px; border: 1px solid rgba(255,255,255,.62); border-radius: 15px; color: var(--current-title-ink); background: rgba(255,255,255,.76); box-shadow: 0 18px 48px rgba(44,59,55,.12), inset 0 1px 0 rgba(255,255,255,.8); backdrop-filter: blur(16px) saturate(155%); opacity: 0; visibility: hidden; transform: translateY(-6px); pointer-events: none; transition: opacity .15s ease, transform .15s var(--ease-out-cove), visibility 0s linear .15s; }
    .task-detail.open { opacity: 1; visibility: visible; transform: translateY(0); pointer-events: auto; transition: opacity .2s cubic-bezier(.23,1,.32,1), transform .2s cubic-bezier(.23,1,.32,1); }
    .detail-block { opacity: 0; transform: translateY(-4px); transition: opacity .2s cubic-bezier(.23,1,.32,1), transform .2s cubic-bezier(.23,1,.32,1); transition-delay: calc(var(--detail-index) * 35ms); }
    .task-detail.open .detail-block { opacity: 1; transform: translateY(0); }
    .task-description { margin: 0; color: rgba(23,33,38,.62); font-size: 12px; line-height: 1.55; }
    .task-meta { margin: 9px 0 12px; color: rgba(23,33,38,.44); font-size: 10px; }
    .detail-label { margin: 0 0 7px; color: rgba(45,127,192,.75); font-size: 9px; font-weight: 680; letter-spacing: .14em; text-transform: uppercase; }
    .detail-actions { display: flex; gap: 7px; }
    .claude-action { display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgba(255,255,255,.7); border-radius: 999px; padding: 7px 10px; color: rgba(23,33,38,.65); background: rgba(255,255,255,.58); box-shadow: 0 5px 13px rgba(44,59,55,.06); font-size: 11px; cursor: pointer; transition: transform .12s var(--ease-out-cove), background .16s ease; }
    .claude-action:hover { background: rgba(255,255,255,.9); }
    .claude-action:active { transform: scale(.97); }
    .action-dot { width: 5px; height: 5px; border-radius: 50%; background: #45a7e8; box-shadow: 0 0 7px rgba(69,167,232,.45); }

    .task-copy { flex: 1; min-width: 0; }

    .task-title {
      margin: 10px 0 14px;
      color: var(--current-title-ink);
      font-size: clamp(22px, 2vw, 28px);
      font-weight: 560;
      letter-spacing: -.025em;
      line-height: 1.12;
      text-wrap: balance;
    }

    .owner-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 22px;
      padding: 0 9px;
      border: 1px solid rgba(72,98,96,.1);
      border-radius: 999px;
      color: rgba(23,33,38,.61);
      background: rgba(255,255,255,.5);
      font-size: 11px;
      font-weight: 570;
      letter-spacing: .005em;
      white-space: nowrap;
    }

    .owner-chip[data-owner="Together"] { color: #6a6c56; background: rgba(246,238,201,.5); }

    .check-orb {
      position: relative;
      flex: 0 0 64px;
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(145deg, var(--orb-blue-1), var(--orb-blue-2));
      box-shadow: 0 12px 28px rgba(37,133,207,.28), 0 0 0 7px rgba(69,167,232,.07), inset 0 1px 1px rgba(255,255,255,.38);
      cursor: pointer;
      transition: transform .1s var(--ease-out-cove), box-shadow .25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .check-orb:hover { box-shadow: 0 15px 34px rgba(37,133,207,.34), 0 0 0 8px rgba(69,167,232,.09), inset 0 1px 1px rgba(255,255,255,.38); }
    .check-orb.is-down { transform: scale(.94); }
    .check-orb:focus-visible, .grid-button:focus-visible, .undo-button:focus-visible, .close-day:focus-visible { outline: 2px solid #2585cf; outline-offset: 3px; }
    .check-orb svg { width: 27px; height: 27px; overflow: visible; }
    .check-rest { fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; opacity: .94; }
    .check-stroke { fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 34; stroke-dashoffset: 34; filter: drop-shadow(0 0 3px rgba(255,255,255,.8)); }
    .check-orb.drawing .check-stroke { animation: drawCheck .22s var(--ease-out-cove) forwards; }
    @keyframes drawCheck { to { stroke-dashoffset: 0; } }

    .river-promotion {
      position: absolute;
      z-index: 10;
      top: 71%;
      left: 50%;
      width: min(560px, 48vw);
      min-height: 150px;
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 27px 27px 27px 31px;
      border: 1px solid rgba(255,255,255,.62);
      border-radius: 25px;
      background: rgba(255,255,255,.74);
      box-shadow: var(--quiet-shadow), inset 0 1px 0 rgba(255,255,255,.72);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      opacity: .45;
      transform: translate(-50%, -50%) scale(.02);
      transform-origin: center;
      pointer-events: none;
    }
    .river-promotion .promotion-content { flex: 1; min-width: 0; opacity: 0; transform: translateY(4px); }
    .river-promotion .promotion-orb { flex: 0 0 64px; width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(145deg, rgba(69,167,232,.44), rgba(37,133,207,.5)); opacity: .32; box-shadow: 0 10px 24px rgba(37,133,207,.16); }
    .river-promotion.compact { min-height: 116px; gap: 15px; padding: 16px 18px; border-radius: 19px; }
    .river-promotion.compact .task-title { margin: 8px 0 10px; font-size: 16px; line-height: 1.28; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    .river-promotion.compact .promotion-orb { flex-basis: 44px; width: 44px; height: 44px; }
    .beads { position: absolute; inset: 0; z-index: 8; pointer-events: none; }
    .bead {
      position: absolute;
      left: 50%;
      width: 10px;
      height: 10px;
      border: 0;
      border-radius: 50%;
      padding: 0;
      background: rgba(119,172,209,.9);
      box-shadow: 0 0 10px 3px rgba(134,189,225,.35);
      pointer-events: auto;
      cursor: pointer;
      transform: translateX(-50%);
      transition: opacity .25s ease, transform .25s var(--ease-out-cove);
    }
    .bead:hover { transform: translateX(-50%) scale(1.2); }
    .bead:nth-child(1) { top: 71%; opacity: .45; }
    .bead:nth-child(2) { top: 80%; opacity: .35; }
    .bead:nth-child(3) { top: 89%; opacity: .25; }
    .bead.consumed { opacity: 0; transform: translateX(-50%) scale(.1); }
    .bead.shift-up { transform: translate(-50%, -9vh); }
    .bead.shift-up-twice { transform: translate(-50%, -18vh); }

    .ripple {
      position: absolute;
      z-index: 9;
      top: 43.5%;
      left: 50%;
      width: 80px;
      height: 80px;
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: rippleDrift .52s var(--ease-out-cove) forwards;
    }
    .ripple circle { fill: none; stroke: rgba(69,167,232,.62); stroke-width: 1.2; transform-origin: center; animation: rippleRing .5s var(--ease-out-cove) forwards; }
    .ripple circle:nth-child(2) { animation-delay: .07s; }
    .ripple circle:nth-child(3) { animation-delay: .14s; }
    @keyframes rippleDrift { to { top: 24%; opacity: 0; transform: translate(calc(-50% + var(--ripple-x, 0px)), -50%) scale(.7); } }
    @keyframes rippleRing { from { transform: scale(.15); opacity: .95; } to { transform: scale(1); opacity: 0; } }
    .ripple.merge-ripple { animation: mergeRipple .34s var(--ease-out-cove) forwards; }
    @keyframes mergeRipple { from { opacity: .9; transform: translate(-50%, -50%) scale(.28); } to { opacity: 0; transform: translate(-50%, -50%) scale(.9); } }
    .ripple.undo-ripple { top: 24%; animation: undoRippleDrift .44s var(--ease-out-cove) forwards; }
    @keyframes undoRippleDrift { to { top: 43.5%; opacity: 0; transform: translate(calc(-50% + var(--ripple-x, 0px)), -50%) scale(1.15); } }

    .bead.new-bottom { animation: beadRise .38s var(--ease-out-cove) both; }
    @keyframes beadRise { from { margin-top: 48px; opacity: .06; } }

    .second-current-wrap { position: absolute; z-index: 6; top: 20.5%; right: 6.5vw; width: 172px; }
    .second-current-card { position: relative; width: 100%; padding: 10px 12px; border: 1px solid rgba(255,255,255,.6); border-radius: 17px; color: var(--current-title-ink); text-align: left; background: rgba(255,255,255,.58); box-shadow: 0 16px 44px rgba(44,59,55,.09), inset 0 1px 0 rgba(255,255,255,.72); backdrop-filter: blur(14px) saturate(150%); cursor: pointer; transition: transform .18s var(--ease-out-cove), background .18s ease, box-shadow .2s ease; }
    .second-current-card:hover { transform: translateY(-1px); background: rgba(255,255,255,.7); }
    .second-current-card:active { transform: scale(.97); }
    .second-current-kicker { display: block; color: rgba(45,127,192,.8); font-size: 8px; font-weight: 680; letter-spacing: .15em; line-height: 1; text-transform: uppercase; }
    .mini-current { display: block; width: 100%; height: 18px; margin: 6px 0 4px; overflow: visible; }

<body>
  <main class="today-shell" id="todayShell" aria-label="Cove Today">
    <header class="day-header">

  <!-- The real app must persist focusCount across sessions: remember my last choice. -->
  <script>
    const seedTasks = [
      { id: 1, title: "Write the Jarvis Pro pitch script for the 30-minute demo call", owner: "Together", description: "Outline the 30-minute demo: the hook, the live Cove walkthrough, the buildout offer, and the close. Brian wants the recording Thursday." },
      { id: 2, title: "Reach out to Bill Lavan (follow-up)", owner: "You", description: "Second follow-up on the consulting proposal. He asked for the revised scope last week; keep it to three sentences and reattach the PDF." },
      { id: 3, title: "Pressure-test the Spitz guest agent scenarios for technical feasibility", owner: "You", description: "Claude ran the six scenarios overnight and flagged two gaps. Review the flags and decide what to tell Brian." },
      { id: 4, title: "Send Zack Bright the newsletter first edit and the AI community brief", owner: "You", description: "Send the first edit of issue 1 plus the community brief doc. Ask which send day he prefers." },
      { id: 5, title: "Draft the Cabo Real demo shot list", owner: "Together", description: "Draft the demo video shot list: guest texting flow, staff view, and the property dashboard. Keep it under 12 shots." },
      { id: 6, title: "Clean up the OIA automation test checklist", owner: "You", description: "Claude drafted the tightened five-check list. Review it and archive the legacy rows." }
    ];

    const state = {
      tasks: seedTasks.map(task => ({ ...task, claudeState: null, readyAt: null })),
      focusCount: 1,
      done: 7,
      emailPending: 2,
      secondCurrentOpen: false,
      detailTaskId: null,
      gridOpen: false,
      busy: false,
      snapshot: null,
      focusChangedInGrid: false
    };

    const zoomProbe = document.createElement("div");
    Object.assign(zoomProbe.style, {
      position: "fixed",
      left: "-1000px",
      top: "-1000px",
      width: "100px",
      height: "100px",
      visibility: "hidden",
      pointerEvents: "none"
    });
    document.body.appendChild(zoomProbe);
    const measuredPageZoom = zoomProbe.getBoundingClientRect().width / 100;
    const pageZoom = measuredPageZoom || 1;
    zoomProbe.remove();
    const local = value => value / pageZoom;

    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const riverContent = document.getElementById("riverContent");
    const beads = document.getElementById("beads");
    const doneCount = document.getElementById("doneCount");
    const secondCurrent = document.getElementById("secondCurrent");
    const secondCurrentButton = document.getElementById("secondCurrentButton");
    const secondCurrentColumn = document.getElementById("secondCurrentColumn");
    const secondCurrentSummary = document.getElementById("secondCurrentSummary");
    const undoToast = document.getElementById("undoToast");
    const undoButton = document.getElementById("undoButton");
    const gridButton = document.getElementById("gridButton");
    const focusOverlay = document.getElementById("focusOverlay");
    const focusPanel = document.getElementById("focusPanel");
    const focusGrid = document.getElementById("focusGrid");
    const gridCount = document.getElementById("gridCount");
    const focusDial = document.getElementById("focusDial");
    let undoTimer = 0;
    const readyTimers = new Map();
    let drag = null;
    let suppressClick = false;

    const wait = ms => new Promise(resolve => setTimeout(resolve, reduceMotion ? Math.min(ms, 120) : ms));

    // Beads sit ON the river curve: sample the core path (viewBox 700x960 maps
    // to the lane at 100% x 100%, so percent coords survive any resize).
    const riverCorePath = document.querySelector(".river-core");
    const riverSamples = (() => {
      const total = riverCorePath.getTotalLength();
      return Array.from({ length: 121 }, (_, i) => riverCorePath.getPointAtLength(total * i / 120));
    })();
    function riverPointAtY(fractionY) {
      const targetY = fractionY * 960;
      let best = riverSamples[0];
      for (const point of riverSamples) if (Math.abs(point.y - targetY) < Math.abs(best.y - targetY)) best = point;
      return best;
    }
    function placeBeads() {
      const fractions = [.71, .80, .89];
      beads.querySelectorAll(".bead").forEach((bead, index) => {
        const point = riverPointAtY(fractions[index] ?? .71);
        bead.style.left = `${(point.x / 700) * 100}%`;
        bead.style.top = `${(point.y / 960) * 100}%`;
      });
    }
    const roman = ["I", "II", "III"];
    const taskById = id => state.tasks.find(task => task.id === Number(id));
    const activeTasks = () => state.tasks;
    const focusTasks = () => activeTasks().slice(0, state.focusCount);
    const focusTask = () => focusTasks()[0];
    const queueTasks = () => activeTasks();

    // A small critically damped spring for settling dragged cards with release velocity.
    function spring({ from = 0, to = 1, velocity = 0, response = .35, damping = 1, update, done }) {
      if (reduceMotion) { update(to); done?.(); return () => {}; }
      let x = from;
      let v = velocity;
      let last = performance.now();
      let active = true;
      const omega = (2 * Math.PI) / response;
      function frame(now) {
        if (!active) return;
        const dt = Math.min((now - last) / 1000, .025);
        last = now;
        const acceleration = -2 * damping * omega * v - omega * omega * (x - to);
        v += acceleration * dt;
        x += v * dt;
        update(x);
        if (Math.abs(x - to) < .001 && Math.abs(v) < .01) {
          update(to);
          done?.();
          return;
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
      return () => { active = false; };
    }

    function ownerChip(task) {
      return `<span class="owner-chip" data-owner="${task.owner}">${task.owner}</span>`;
    }

    function renderClock() {
      const now = new Date();
      document.getElementById("clock").textContent = now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      const hour = now.getHours();
      const part = hour < 12 ? "Good morning." : hour < 17 ? "Good afternoon." : "Good evening.";
      document.getElementById("greeting").textContent = `${part} One thing at a time.`;
      renderSun(now);
    }

    function renderSun(now) {
      const arc = document.querySelector(".sun-arc-path");
      const dot = document.getElementById("sunNow");
      if (!arc || !dot) return;
      // Day runs 6:00 to 21:00 across the arc; the dot rides the path itself
      // so it can never float off the line.
      const minutes = now.getHours() * 60 + now.getMinutes();
      const fraction = Math.min(1, Math.max(0, (minutes - 360) / 900));
      const point = arc.getPointAtLength(arc.getTotalLength() * fraction);
      dot.setAttribute("cx", point.x);
      dot.setAttribute("cy", point.y);
    }

    function scheduleClock() {
      renderClock();
      setTimeout(scheduleClock, 60000 - (Date.now() % 60000) + 20);
    }

    function taskStateMarkup(task) {
      if (task.claudeState === "planning") return `<div class="task-state"><span class="working-dot"></span><span>Planning with Claude</span></div>`;
      if (task.claudeState === "working") return `<div class="task-state"><span class="working-dot"></span><span>Claude working</span></div>`;
      if (task.claudeState === "conversation") return `<div class="task-state conversation"><span>In conversation</span></div>`;
      return "";
    }

    function taskFooterMarkup(task) {
      const ready = task.claudeState === "ready" || task.claudeState === "conversation";
      return `<div class="task-footer">${ownerChip(task)}${ready ? `<button class="ready-button${task.readyFresh ? " materializing" : ""}" type="button" data-ready="${task.id}">Ready</button>` : ""}</div>`;
    }

    function detailMarkup(task) {
      return `<div class="task-detail" data-detail-id="${task.id}" aria-hidden="true">
        <p class="task-description detail-block" style="--detail-index:0">${task.description}</p>
        <p class="task-meta detail-block" style="--detail-index:1">${task.owner} · From this morning's plan</p>
        <div class="detail-block" style="--detail-index:2"><p class="detail-label">Start with Claude</p><div class="detail-actions">
          <button class="claude-action" type="button" data-start="planning" data-task-id="${task.id}"><span class="action-dot"></span>Planning</button>
          <button class="claude-action" type="button" data-start="auto" data-task-id="${task.id}"><span class="action-dot"></span>Auto</button>
        </div></div>
      </div>`;
    }

    function focusCardMarkup(task, index, restored, refresh = false) {
      const check = `<button class="check-orb" type="button" aria-label="Mark ${task.title} done"><svg viewBox="0 0 28 28" aria-hidden="true"><path class="check-rest" d="M5 14.5 L11.2 20.2 L23 7.8"/><path class="check-stroke" d="M5 14.5 L11.2 20.2 L23 7.8"/></svg></button>`;
      if (state.focusCount === 1) return `<div class="now-wrap focus-unit${refresh ? " focus-refresh" : ""}" data-focus-index="0"><article class="now-card${restored ? " restored" : ""}" id="nowCard" data-focus-card data-task-id="${task.id}" role="button" tabindex="0" aria-expanded="false"><div class="task-copy"><p class="kicker">Now</p><h1 class="task-title">${task.title}</h1>${taskStateMarkup(task)}${taskFooterMarkup(task)}</div>${check}</article>${detailMarkup(task)}</div>`;
      return `<div class="focus-unit" data-focus-index="${index}"><article class="compact-focus-card${restored ? " restored" : ""}" data-focus-card data-task-id="${task.id}" role="button" tabindex="0" aria-expanded="false"><div class="compact-copy"><p class="compact-kicker">Focus ${roman[index]}</p><h2 class="compact-title">${task.title}</h2>${taskStateMarkup(task)}${taskFooterMarkup(task)}</div>${check}</article>${detailMarkup(task)}</div>`;
    }

    function renderRiver(mode = "", restoredSlot = -1) {
      const queue = queueTasks();
      const focused = focusTasks();
      const refresh = mode === "swap";
      if (!focused.length) riverContent.innerHTML = `<div class="clear-state"><h2>You're clear for now.</h2><button class="close-day" type="button">Close My Day</button></div>`;
      else if (state.focusCount === 1) riverContent.innerHTML = focusCardMarkup(focused[0], 0, mode === "restore", refresh);
      else riverContent.innerHTML = `<div class="focus-band count-${state.focusCount}${refresh ? " focus-refresh" : ""}">${focused.map((task, index) => focusCardMarkup(task, index, mode === "restore" && index === restoredSlot)).join("")}</div>`;
      wireFocusCards();
      if (state.detailTaskId) setTaskDetail(state.detailTaskId, true);
      const remaining = Math.max(0, queue.length - focused.length);
      const beadCount = Math.min(3, remaining);
      beads.innerHTML = Array.from({ length: beadCount }, (_, index) => `<button class="bead${mode === "promotion" && remaining >= 3 && index === beadCount - 1 ? " new-bottom" : ""}" type="button" aria-label="Open Focus Grid" data-index="${index}"></button>`).join("");
      beads.querySelectorAll(".bead").forEach(bead => bead.addEventListener("click", openGrid));
      placeBeads();
      renderSecondCurrent();
    }

    function renderSecondCurrent() {
      secondCurrentSummary.textContent = "Email · 2 rhythms";
      secondCurrent.classList.toggle("active", state.emailPending > 0);
      secondCurrentButton.setAttribute("aria-expanded", String(state.secondCurrentOpen));
      secondCurrentColumn.setAttribute("aria-hidden", String(!state.secondCurrentOpen));
      const items = [
        { kicker: state.emailPending ? "Email needs you" : "Email · clear", line: state.emailPending ? `${state.emailPending} threads waiting` : "Nothing waiting" },
        { kicker: "Rhythm", line: "Weekly review prep" },
        { kicker: "Rhythm", line: "Inbox sweep at 4:30" }
      ];
      secondCurrentColumn.innerHTML = items.map((item, index) => `<article class="second-current-item" style="--item-index:${index}">
        <div class="item-kicker">${item.kicker}</div>
        <div class="item-line"><span>${item.line}</span></div>
      </article>`).join("");
      void secondCurrentColumn.offsetHeight;
      secondCurrent.classList.toggle("open", state.secondCurrentOpen);
    }

    function setSecondCurrentOpen(open) {
      state.secondCurrentOpen = open;
      renderSecondCurrent();
    }

    function setTaskDetail(id, forceOpen = false) {
      if (state.busy && id != null) return;
      const numericId = id == null ? null : Number(id);
      const next = numericId == null ? null : forceOpen ? numericId : state.detailTaskId === numericId ? null : numericId;
      state.detailTaskId = next;
      riverContent.querySelectorAll(".task-detail").forEach(panel => { panel.classList.remove("open"); panel.setAttribute("aria-hidden", "true"); });
      riverContent.querySelectorAll("[data-focus-card]").forEach(card => card.setAttribute("aria-expanded", String(Number(card.dataset.taskId) === next)));
      if (!next) return;
      const panel = riverContent.querySelector(`[data-detail-id="${next}"]`);
      if (!panel) { state.detailTaskId = null; return; }
      void panel.offsetHeight;
      requestAnimationFrame(() => { if (state.detailTaskId === next) { panel.classList.add("open"); panel.setAttribute("aria-hidden", "false"); } });
    }

    function clearReadyTimer(id) {
      clearTimeout(readyTimers.get(Number(id)));
      readyTimers.delete(Number(id));
    }

    function finishTaskReady(id) {
      readyTimers.delete(Number(id));
      const task = taskById(id);
      if (!task || !["planning", "working"].includes(task.claudeState)) return;
      if (state.busy) {
        readyTimers.set(task.id, setTimeout(() => finishTaskReady(task.id), 250));
        return;
      }
      task.claudeState = "ready";
      task.readyAt = null;
      task.readyFresh = true;
      renderRiver();
      task.readyFresh = false;
    }

    function scheduleTaskReady(task, slotIndex) {
      clearReadyTimer(task.id);
      if (!task.readyAt) task.readyAt = Date.now() + (slotIndex === 0 ? 7000 : 10000);
      const delay = Math.max(0, task.readyAt - Date.now());
      readyTimers.set(task.id, setTimeout(() => finishTaskReady(task.id), delay));
    }

    function syncReadyTimers() {
      readyTimers.forEach(timer => clearTimeout(timer));
      readyTimers.clear();
      state.tasks.forEach((task, index) => {
        if (["planning", "working"].includes(task.claudeState) && task.readyAt) scheduleTaskReady(task, index);
      });
    }

    function openClaudeConversation(id) {
      const task = taskById(id);
      if (!task || !["ready", "conversation"].includes(task.claudeState) || state.busy) return;
      task.claudeState = "conversation";
      renderRiver();
      const unit = riverContent.querySelector(`[data-task-id="${task.id}"]`)?.closest(".focus-unit");
      if (!unit) return;
      const toast = document.createElement("div");
      toast.className = "claude-open-toast";
      toast.setAttribute("role", "status");
      toast.textContent = "Opening in Claude";
      unit.appendChild(toast);
      setTimeout(() => toast.remove(), 1450);
    }

    function wireFocusCards() {
      riverContent.querySelectorAll("[data-focus-card]").forEach(card => {
        card.addEventListener("click", event => { if (!event.target.closest("button")) setTaskDetail(card.dataset.taskId); });
        card.addEventListener("keydown", event => { if ((event.key === "Enter" || event.key === " ") && !event.target.closest("button")) { event.preventDefault(); setTaskDetail(card.dataset.taskId); } });
        const orb = card.querySelector(".check-orb");
        orb.addEventListener("pointerdown", event => { event.stopPropagation(); orb.classList.add("is-down"); });
        ["pointerup", "pointercancel", "pointerleave"].forEach(type => orb.addEventListener(type, () => orb.classList.remove("is-down")));
        orb.addEventListener("click", event => { event.stopPropagation(); markDone(card.dataset.taskId); });
      });
      riverContent.querySelectorAll("[data-start]").forEach(button => button.addEventListener("click", event => { event.stopPropagation(); startWithClaude(button.dataset.taskId, button.dataset.start); }));
      riverContent.querySelectorAll("[data-ready]").forEach(button => button.addEventListener("click", event => { event.stopPropagation(); openClaudeConversation(button.dataset.ready); }));
    }

    function tickDone(nextValue) {
      const old = doneCount.querySelector("span");
      old?.classList.add("leaving");
      const incoming = document.createElement("span");
      incoming.className = "arriving";
      incoming.textContent = `${nextValue} done today`;
      doneCount.appendChild(incoming);
      requestAnimationFrame(() => incoming.classList.remove("arriving"));
      setTimeout(() => old?.remove(), 160);
    }

    function snapshotState(slotIndex) {
      return {
        tasks: state.tasks.map(task => ({ ...task })),
        done: state.done,
        focusCount: state.focusCount,
        slotIndex
      };
    }

    function createRipple(className = "ripple") {
      const template = document.createElement("template");
      template.innerHTML = `<svg class="${className}" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="12"/><circle cx="40" cy="40" r="23"/><circle cx="40" cy="40" r="34"/></svg>`;
      return template.content.firstElementChild;
    }

    function animateBeadConsumption() {
      const nodes = [...beads.querySelectorAll(".bead")];
      const index = nodes.findIndex(node => !node.classList.contains("consumed"));
      if (index < 0) return;
      nodes[index].classList.add("consumed");
      nodes.slice(index + 1).forEach(node => node.classList.add(index === 0 ? "shift-up" : "shift-up-twice"));
    }

    function promotionMarkup(task, compact = false, slotIndex = 0) {
      const template = document.createElement("template");
      template.innerHTML = `<article class="river-promotion${compact ? " compact" : ""}" aria-hidden="true">
        <div class="promotion-content">
          <p class="kicker">${compact ? `Focus ${roman[slotIndex]}` : "Now"}</p>
          <p class="task-title">${task.title}</p>
          ${ownerChip(task)}
        </div>
        <span class="promotion-orb"></span>
      </article>`;
      return template.content.firstElementChild;
    }

    function riseFromRiver(task, { slotIndex = 0 } = {}) {
      return new Promise(resolve => {
        const lane = document.querySelector(".lane");
        const compact = state.focusCount > 1;
        const card = promotionMarkup(task, compact, slotIndex);
        const content = card.querySelector(".promotion-content");
        // Target the slot CONTAINER, not the card: the completed card's rect is
        // displaced by its exit transform (parked at the done marker), while the
        // container keeps the slot's flex position. If layout is between frames,
        // derive the seat from row geometry.
        const targetNode = riverContent.querySelector(`[data-focus-index="${slotIndex}"]`);
        const laneRect = lane.getBoundingClientRect();
        const targetRect = targetNode?.getBoundingClientRect();
        const laneCenter = lane.clientWidth / 2;
        const slotWidth = state.focusCount === 2 ? 332 : 296;
        const seatX = state.focusCount > 1
          ? laneCenter + (slotIndex - (state.focusCount - 1) / 2) * (slotWidth + 18)
          : laneCenter;
        const targetX = targetRect && targetRect.width > 40 ? local(targetRect.left + targetRect.width / 2 - laneRect.left) : seatX;
        const startY = lane.clientHeight * .71;
        const targetY = lane.clientHeight * .435;
        const targetScale = 1;
        const startX = targetX;
        if (compact) card.style.width = `${state.focusCount === 2 ? 332 : 296}px`;
        lane.appendChild(card);
        if (reduceMotion) {
          Object.assign(card.style, { left: `${targetX}px`, top: `${targetY}px`, opacity: "0", transform: "translate(-50%, -50%) scale(1)" });
          Object.assign(content.style, { opacity: "1", transform: "none" });
          requestAnimationFrame(() => { card.style.opacity = "1"; });
          setTimeout(() => resolve(card), 130);
          return;
        }
        spring({
          from: 0,
          to: 1,
          response: .4,
          damping: 1,
          update(value) {
            const progress = Math.max(0, Math.min(1, value));
            const contentProgress = Math.max(0, Math.min(1, (progress - .65) / .35));
            card.style.left = `${startX + (targetX - startX) * progress}px`;
            card.style.top = `${startY + (targetY - startY) * progress}px`;
            card.style.opacity = `${.45 + .55 * progress}`;
            card.style.transform = `translate(-50%, -50%) scale(${.6 + (targetScale - .6) * progress})`;
            content.style.opacity = `${contentProgress}`;
            content.style.transform = `translateY(${4 * (1 - contentProgress)}px)`;
          },
          done() { resolve(card); }
        });
      });
    }

    function positionRipple(ripple, card, undo = false, slotIndex = 0) {
      const lane = document.querySelector(".lane");
      const laneRect = lane.getBoundingClientRect();
      const cardRect = card?.getBoundingClientRect();
      const laneCenter = lane.clientWidth / 2;
      if (undo) {
        const markerRect = document.querySelector(".done-marker").getBoundingClientRect();
        const width = state.focusCount === 2 ? 332 : 296;
        const fallback = state.focusCount === 1 ? 0 : (slotIndex - (state.focusCount - 1) / 2) * (width + 18);
        ripple.style.top = `${local(markerRect.top + markerRect.height / 2 - laneRect.top)}px`;
        ripple.style.setProperty("--ripple-x", `${cardRect ? local(cardRect.left + cardRect.width / 2 - laneRect.left) - laneCenter : fallback}px`);
      } else if (cardRect) {
        const startX = local(cardRect.left + cardRect.width / 2 - laneRect.left);
        ripple.style.left = `${startX}px`;
        ripple.style.top = `${local(cardRect.top + cardRect.height / 2 - laneRect.top)}px`;
        ripple.style.setProperty("--ripple-x", `${laneCenter - startX}px`);
      }
    }

    function placeMergeRipple() {
      const lane = document.querySelector(".lane");
      const laneRect = lane.getBoundingClientRect();
      const markerRect = document.querySelector(".done-marker").getBoundingClientRect();
      const ripple = createRipple("ripple merge-ripple");
      ripple.style.left = `${local(markerRect.left + markerRect.width / 2 - laneRect.left)}px`;
      ripple.style.top = `${local(markerRect.top + markerRect.height / 2 - laneRect.top)}px`;
      lane.appendChild(ripple);
      setTimeout(() => ripple.remove(), reduceMotion ? 140 : 380);
    }

    function flowCompletedCard(card) {
      if (!card) return Promise.resolve();
      if (reduceMotion) {
        card.style.transition = "opacity .12s ease";
        card.style.opacity = "0";
        return wait(120);
      }
      const from = card.getBoundingClientRect();
      const marker = document.querySelector(".done-marker").getBoundingClientRect();
      const dx = local(marker.left + marker.width / 2 - (from.left + from.width / 2));
      const dy = local(marker.top + marker.height / 2 - (from.top + from.height / 2));
      const controlX = dx * .72 + (Math.abs(dx) < 8 ? 18 : 0);
      const controlY = dy * .42 - 28;
      return new Promise(resolve => {
        const started = performance.now();
        function frame(now) {
          const t = Math.min(1, (now - started) / 460);
          const progress = 1 - Math.pow(1 - t, 3);
          const inverse = 1 - progress;
          const x = 2 * inverse * progress * controlX + progress * progress * dx;
          const y = 2 * inverse * progress * controlY + progress * progress * dy;
          const fade = Math.max(0, (progress - .14) / .86);
          card.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${1.03 - progress * .83})`;
          card.style.opacity = `${1 - fade * .82}`;
          card.style.borderRadius = `${25 + progress * 25}px`;
          if (t < 1) requestAnimationFrame(frame);
          else { card.style.visibility = "hidden"; resolve(); }
        }
        requestAnimationFrame(frame);
      });
    }

    function sinkCardIntoRiver(card) {
      if (!card) return Promise.resolve();
      if (reduceMotion) {
        card.style.transition = "opacity .12s ease";
        card.style.opacity = "0";
        return wait(120);
      }
      const lane = document.querySelector(".lane");
      const laneRect = lane.getBoundingClientRect();
      const from = card.getBoundingClientRect();
      const bead = beads.querySelector(".bead")?.getBoundingClientRect();
      const fromX = local(from.left + from.width / 2 - laneRect.left);
      const fromY = local(from.top + from.height / 2 - laneRect.top);
      const targetX = bead ? local(bead.left + bead.width / 2 - laneRect.left) : lane.clientWidth / 2;
      const targetY = bead ? local(bead.top + bead.height / 2 - laneRect.top) : lane.clientHeight * .71;
      const dx = targetX - fromX;
      const dy = targetY - fromY;
      return new Promise(resolve => {
        const started = performance.now();
        function frame(now) {
          const t = Math.min(1, (now - started) / 280);
          const progress = 1 - Math.pow(1 - t, 3);
          const inverse = 1 - progress;
          const x = 2 * inverse * progress * (dx * .7) + progress * progress * dx;
          const y = 2 * inverse * progress * (dy * .46 + 20) + progress * progress * dy;
          card.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${1 - progress * .88})`;
          card.style.opacity = `${1 - progress * .9}`;
          card.style.borderRadius = `${25 + progress * 25}px`;
          if (t < 1) requestAnimationFrame(frame);
          else resolve();
        }
        requestAnimationFrame(frame);
      });
    }

    async function reformCardFromDone(slotIndex) {
      const card = riverContent.querySelector(`[data-focus-index="${slotIndex}"] [data-focus-card]`);
      if (!card) return;
      const target = card.getBoundingClientRect();
      const marker = document.querySelector(".done-marker").getBoundingClientRect();
      const dx = local(marker.left + marker.width / 2 - (target.left + target.width / 2));
      const dy = local(marker.top + marker.height / 2 - (target.top + target.height / 2));
      card.style.transition = "none";
      card.style.opacity = "0";
      card.style.filter = reduceMotion ? "none" : "blur(2px)";
      card.style.borderRadius = reduceMotion ? "" : "50%";
      card.style.transform = reduceMotion ? "none" : `translate3d(${dx}px, ${dy}px, 0) scale(.2)`;
      void card.offsetWidth;
      await new Promise(resolve => requestAnimationFrame(resolve));
      card.style.transition = reduceMotion
        ? "opacity .12s ease"
        : "transform .44s var(--ease-out-cove), opacity .32s ease, filter .32s ease, border-radius .38s var(--ease-out-cove)";
      card.style.opacity = "1";
      card.style.filter = "blur(0)";
      card.style.borderRadius = "";
      card.style.transform = "translate3d(0,0,0) scale(1)";
      await wait(reduceMotion ? 120 : 460);
      card.style.removeProperty("transition");
      card.style.removeProperty("transform");
      card.style.removeProperty("opacity");
      card.style.removeProperty("filter");
      card.style.removeProperty("border-radius");
    }

    async function refillFocusSlot(slotIndex) {
      const boundary = Math.min(state.focusCount - 1, state.tasks.length);
      const candidate = state.tasks[boundary];
      if (!candidate) return null;
      animateBeadConsumption();
      state.tasks.splice(boundary, 1);
      state.tasks.splice(Math.min(slotIndex, state.tasks.length), 0, candidate);
      return riseFromRiver(candidate, { slotIndex });
    }

    function restoreSnapshot(saved) {
      state.tasks = saved.tasks.map(task => ({ ...task }));
      state.done = saved.done;
      state.focusCount = saved.focusCount;
      syncReadyTimers();
    }

    function showUndo() {
      clearTimeout(undoTimer);
      undoToast.classList.remove("visible");
      void undoToast.offsetWidth;
      undoToast.classList.add("visible");
      undoTimer = setTimeout(() => undoToast.classList.remove("visible"), 6000);
    }

    function startWithClaude(id, mode) {
      const task = taskById(id);
      const slotIndex = state.tasks.findIndex(item => item.id === Number(id));
      if (!task || slotIndex < 0 || slotIndex >= state.focusCount || state.busy) return;
      setTaskDetail(null);
      task.claudeState = mode === "planning" ? "planning" : "working";
      task.readyAt = null;
      task.readyFresh = false;
      scheduleTaskReady(task, slotIndex);
      renderRiver();
    }

    async function markDone(id) {
      const completed = taskById(id);
      const slotIndex = state.tasks.findIndex(task => task.id === Number(id));
      if (state.busy || !completed || slotIndex < 0 || slotIndex >= state.focusCount) return;
      state.busy = true;
      setTaskDetail(null);
      state.snapshot = snapshotState(slotIndex);
      clearReadyTimer(completed.id);
      const card = riverContent.querySelector(`[data-task-id="${completed.id}"]`);
      const orb = card.querySelector(".check-orb");
      orb.classList.add("drawing");
      card.classList.add("pulsing", "confirming");
      const refillReady = wait(120);
      await wait(90);
      card.classList.remove("confirming");
      card.classList.add("completing");
      state.tasks.splice(slotIndex, 1);
      state.done += 1;
      const exitPromise = flowCompletedCard(card);
      const refillPromise = refillReady.then(() => refillFocusSlot(slotIndex));

      await exitPromise;
      placeMergeRipple();
      tickDone(state.done);

      const promotion = await refillPromise;
      renderRiver(promotion ? "promotion" : "");
      promotion?.remove();
      showUndo();
      state.busy = false;
    }

    undoButton.addEventListener("click", async () => {
      if (!state.snapshot || state.busy) return;
      state.busy = true;
      clearTimeout(undoTimer);
      undoToast.classList.remove("visible");
      const slotIndex = state.snapshot.slotIndex;
      const current = riverContent.querySelector(`[data-focus-index="${slotIndex}"] [data-focus-card]`);
      const ripple = createRipple("ripple undo-ripple");
      positionRipple(ripple, current, true, slotIndex);
      await sinkCardIntoRiver(current);
      restoreSnapshot(state.snapshot);
      document.querySelector(".lane").appendChild(ripple);
      tickDone(state.done);
      renderRiver();
      await reformCardFromDone(slotIndex);
      ripple.remove();
      state.snapshot = null;
      state.busy = false;
    });

    function calculatePanelOrigin() {
      const buttonRect = gridButton.getBoundingClientRect();
      const panelRect = focusPanel.getBoundingClientRect();
      const x = (local(buttonRect.left + buttonRect.width / 2 - panelRect.left) / local(panelRect.width)) * 100;
      const y = (local(buttonRect.top + buttonRect.height / 2 - panelRect.top) / local(panelRect.height)) * 100;
      focusPanel.style.setProperty("--origin-x", `${Math.max(0, Math.min(100, x))}%`);
      focusPanel.style.setProperty("--origin-y", `${Math.max(0, Math.min(100, y))}%`);
    }

    function openGrid() {
      if (state.gridOpen || state.busy) return;
      setTaskDetail(null);
      state.gridOpen = true;
      renderGrid();
      focusOverlay.classList.remove("closing");
      focusOverlay.classList.add("open", "opening-cards");
      focusOverlay.setAttribute("aria-hidden", "false");
      document.body.classList.add("grid-open");
      gridButton.setAttribute("aria-expanded", "true");
      gridButton.setAttribute("aria-label", "Close Focus Grid");
      requestAnimationFrame(calculatePanelOrigin);
      setTimeout(() => focusOverlay.classList.remove("opening-cards"), reduceMotion ? 140 : 430);
    }

    async function closeGrid() {
      if (!state.gridOpen) return;
      state.gridOpen = false;
      cancelGridDrag();
      focusOverlay.classList.remove("opening-cards");
      focusOverlay.classList.add("closing");
      document.body.classList.remove("grid-open");
      gridButton.setAttribute("aria-expanded", "false");
      gridButton.setAttribute("aria-label", "Open Focus Grid");
      await wait(300);
      focusOverlay.classList.remove("open", "closing");
      focusOverlay.setAttribute("aria-hidden", "true");
      focusGrid.replaceChildren();
      renderRiver(state.focusChangedInGrid ? "swap" : "");
      state.focusChangedInGrid = false;
    }

    function cancelGridDrag() {
      drag?.card?.classList.remove("drag-placeholder");
      drag?.clone?.remove();
      drag = null;
      focusOverlay.querySelectorAll(".drag-float").forEach(node => node.remove());
      focusGrid.querySelectorAll(".drop-ready").forEach(node => node.classList.remove("drop-ready"));
    }

    secondCurrentButton.addEventListener("click", event => {
      event.stopPropagation();
      setTaskDetail(null);
      setSecondCurrentOpen(!state.secondCurrentOpen);
    });
    document.addEventListener("click", event => {
      if (state.secondCurrentOpen && !secondCurrent.contains(event.target)) setSecondCurrentOpen(false);
      if (state.detailTaskId && !event.target.closest(".focus-unit")) setTaskDetail(null);
    });
    gridButton.addEventListener("pointerdown", () => gridButton.classList.add("is-down"));
    gridButton.addEventListener("pointerup", () => gridButton.classList.remove("is-down"));
    gridButton.addEventListener("pointercancel", () => gridButton.classList.remove("is-down"));
    gridButton.addEventListener("click", () => state.gridOpen ? closeGrid() : openGrid());
    focusOverlay.addEventListener("click", event => { if (event.target === focusOverlay) closeGrid(); });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && state.gridOpen) closeGrid();
      if (event.key === "Escape" && state.secondCurrentOpen) setSecondCurrentOpen(false);
      if (event.key === "Escape" && state.detailTaskId) setTaskDetail(null);
      if (state.gridOpen && ["1","2","3"].includes(event.key)) { event.preventDefault(); setFocusCount(Number(event.key)); }
      if (event.key.toLowerCase() === "g" && !event.metaKey && !event.ctrlKey && !event.altKey) {
        event.preventDefault();
        state.gridOpen ? closeGrid() : openGrid();
      }
    });

    focusDial.addEventListener("click", event => {
      const segment = event.target.closest("[data-count]");
      if (segment) setFocusCount(Number(segment.dataset.count));
    });

    function renderDial() {
      focusDial.style.setProperty("--dial-offset", `${(state.focusCount - 1) * 100}%`);
      focusDial.querySelectorAll("[data-count]").forEach(segment => {
        const active = Number(segment.dataset.count) === state.focusCount;
        segment.classList.toggle("active", active);
        segment.setAttribute("aria-checked", String(active));
      });
    }

    function setFocusCount(count) {
      if (state.busy) return;
      if (drag) cancelGridDrag();
      const available = state.tasks.length;
      const next = Math.max(1, Math.min(3, count, available || 1));
      if (next === state.focusCount) { renderDial(); return; }
      state.focusCount = next;
      if (!focusTasks().some(task => task.id === state.detailTaskId)) state.detailTaskId = null;
      state.focusChangedInGrid = true;
      renderDial();
      renderGrid();
    }

    function gridCardMarkup(task, position) {
      const isFocus = position < state.focusCount;
      return `<article class="grid-card${isFocus ? " focus-slot" : ""}" data-task-id="${task.id}" data-grid-position="${position}" style="--stagger:${position * 35}ms">
        ${isFocus ? `<p class="kicker">Focus ${roman[position]}</p>` : ""}
        <p class="grid-task-title">${task.title}</p>
        <div class="grid-card-bottom">
          ${ownerChip(task)}
        </div>
      </article>`;
    }

    function renderGrid(blinkPosition = null) {
      const ordered = activeTasks();
      focusGrid.innerHTML = ordered.map((task, position) => gridCardMarkup(task, position)).join("");
      gridCount.textContent = `${state.tasks.length} open · ${state.done} done`;
      renderDial();
      if (blinkPosition !== null) focusGrid.querySelector(`[data-grid-position="${blinkPosition}"]`)?.classList.add("focus-blink");
    }

    function swapBandTasks(sourceId, targetId) {
      const sourceIndex = state.tasks.findIndex(task => task.id === Number(sourceId));
      const targetIndex = state.tasks.findIndex(task => task.id === Number(targetId));
      if (sourceIndex < 0 || targetIndex < 0) return false;
      const next = [...state.tasks];
      [next[sourceIndex], next[targetIndex]] = [next[targetIndex], next[sourceIndex]];
      state.tasks = next;
      state.focusChangedInGrid = true;
      renderGrid(Math.min(sourceIndex, targetIndex));
      return true;
    }

    focusGrid.addEventListener("pointerdown", event => {
      if (event.button !== 0 || event.target.closest("button")) return;
      const card = event.target.closest(".grid-card");
      if (!card) return;
      const rect = card.getBoundingClientRect();
      card.setPointerCapture(event.pointerId);
      drag = {
        pointerId: event.pointerId,
        id: Number(card.dataset.taskId),
        originalPosition: Number(card.dataset.gridPosition),
        card,
        startX: event.clientX,
        startY: event.clientY,
        offsetX: event.clientX - rect.left,
        offsetY: event.clientY - rect.top,
        originRect: rect,
        originalOrder: state.tasks.map(task => task.id),
        active: false,
        clone: null,
        lastX: event.clientX,
        lastY: event.clientY,
        lastTime: performance.now(),
        velocityX: 0,
        velocityY: 0,
        validDrop: false
      };
    });

    focusGrid.addEventListener("pointermove", event => {
      if (!drag || drag.pointerId !== event.pointerId) return;
      const distance = Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY);
      if (!drag.active && distance < 10) return;
      if (!drag.active) beginDrag();
      const now = performance.now();
      const dt = Math.max(1, now - drag.lastTime);
      drag.velocityX = (event.clientX - drag.lastX) / dt;
      drag.velocityY = (event.clientY - drag.lastY) / dt;
      drag.lastX = event.clientX;
      drag.lastY = event.clientY;
      drag.lastTime = now;
      moveDragClone(event.clientX, event.clientY);
      updateDragTarget(event.clientX, event.clientY);
    });

    focusGrid.addEventListener("pointerup", finishDrag);
    focusGrid.addEventListener("pointercancel", finishDrag);

    function beginDrag() {
      drag.active = true;
      suppressClick = true;
      const clone = drag.card.cloneNode(true);
      clone.classList.add("drag-float");
      clone.style.left = `${local(drag.originRect.left)}px`;
      clone.style.top = `${local(drag.originRect.top)}px`;
      clone.style.width = `${local(drag.originRect.width)}px`;
      clone.style.height = `${local(drag.originRect.height)}px`;
      focusOverlay.appendChild(clone);
      drag.clone = clone;
      drag.card.classList.add("drag-placeholder");
    }

    function moveDragClone(x, y) {
      drag.clone.style.left = `${local(x - drag.offsetX)}px`;
      drag.clone.style.top = `${local(y - drag.offsetY)}px`;
    }

    function updateDragTarget(x, y) {
      const hit = document.elementFromPoint(x, y)?.closest(".grid-card");
      focusGrid.querySelectorAll(".focus-slot").forEach(slot => slot.classList.toggle("drop-ready", slot === hit && Number(hit.dataset.taskId) !== drag.id));
      drag.validDrop = Boolean(hit);
      if (!hit || Number(hit.dataset.taskId) === drag.id) return;
      if (drag.originalPosition < state.focusCount || Number(hit.dataset.gridPosition) < state.focusCount) return;
      const before = y < hit.getBoundingClientRect().top + hit.getBoundingClientRect().height / 2;
      flipInsert(drag.card, hit, before);
    }

    function flipInsert(moving, target, before) {
      const cards = [...focusGrid.querySelectorAll(".grid-card")];
      const first = new Map(cards.map(card => [card, card.getBoundingClientRect()]));
      focusGrid.insertBefore(moving, before ? target : target.nextSibling);
      cards.forEach(card => {
        if (card === moving) return;
        const oldRect = first.get(card);
        const nextRect = card.getBoundingClientRect();
        const dx = oldRect.left - nextRect.left;
        const dy = oldRect.top - nextRect.top;
        if (!dx && !dy) return;
        card.style.transition = "none";
        card.style.transform = `translate(${local(dx)}px, ${local(dy)}px)`;
        requestAnimationFrame(() => {
          card.style.transition = "transform .3s cubic-bezier(.2,.78,.22,1)";
          card.style.transform = "";
        });
      });
    }

    function finishDrag(event) {
      if (!drag || drag.pointerId !== event.pointerId) return;
      const activeDrag = drag;
      drag = null;
      focusGrid.querySelectorAll(".drop-ready").forEach(node => node.classList.remove("drop-ready"));
      if (!activeDrag.active) return;
      const hit = document.elementFromPoint(event.clientX, event.clientY)?.closest(".grid-card");
      let accepted = false;
      if (hit && Number(hit.dataset.taskId) !== activeDrag.id) {
        const sourceIndex = state.tasks.findIndex(task => task.id === activeDrag.id);
        const targetIndex = state.tasks.findIndex(task => task.id === Number(hit.dataset.taskId));
        if (sourceIndex < state.focusCount || targetIndex < state.focusCount) accepted = swapBandTasks(activeDrag.id, hit.dataset.taskId);
        else {
          state.tasks = [...focusGrid.querySelectorAll(".grid-card")].map(card => taskById(card.dataset.taskId)).filter(Boolean);
          state.focusChangedInGrid = true;
          renderGrid();
          accepted = true;
        }
      } else if (activeDrag.validDrop && activeDrag.originalPosition >= state.focusCount) {
        state.tasks = [...focusGrid.querySelectorAll(".grid-card")].map(card => taskById(card.dataset.taskId)).filter(Boolean);
        state.focusChangedInGrid = true;
        renderGrid();
        accepted = true;
      }

      if (!accepted) {
        const byId = new Map(state.tasks.map(task => [task.id, task]));
        state.tasks = activeDrag.originalOrder.map(id => byId.get(id)).filter(Boolean);
      }
      settleClone(activeDrag, accepted);
      setTimeout(() => { suppressClick = false; }, 80);
    }

    function settleClone(activeDrag, accepted) {
      const clone = activeDrag.clone;
      if (!clone) return;
      const target = focusGrid.querySelector(`[data-task-id="${activeDrag.id}"]`);
      if (accepted) {
        clone.remove();
        target?.classList.remove("drag-placeholder");
        target?.classList.add("drop-settle");
        setTimeout(() => target?.classList.remove("drop-settle"), 360);
        return;
      }
      const targetRect = target?.getBoundingClientRect() || activeDrag.originRect;
      const startLeft = parseFloat(clone.style.left);
      const startTop = parseFloat(clone.style.top);
      const dx = local(targetRect.left) - startLeft;
      const dy = local(targetRect.top) - startTop;
      const velocity = local(Math.hypot(activeDrag.velocityX, activeDrag.velocityY)) * .12;
      spring({
        from: 0,
        to: 1,
        velocity,
        response: accepted ? .3 : .38,
        damping: accepted ? .85 : .72,
        update(value) {
          clone.style.left = `${startLeft + dx * value}px`;
          clone.style.top = `${startTop + dy * value}px`;
          clone.style.transform = `rotate(${1 - value}deg) scale(${1.04 - .04 * value})`;
        },
        done() {
          clone.remove();
          target?.classList.remove("drag-placeholder");
          if (!accepted) renderGrid();
        }
      });
    }

    scheduleClock();
    renderRiver();
  </script>
</body>
</html>
